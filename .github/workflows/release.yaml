name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write
  packages: write
  id-token: write # needed for cosign keyless signing

env:
  BINARY_NAME: tron-validator-watcher
  IMAGE_NAME: tron-validator-watcher

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: fixed-egress-4c-16g
            os_name: linux
            arch: amd64
          - runner: fixed-egress-4c-16g
            os_name: linux
            arch: arm64
          - runner: fixed-egress-4c-16g
            os_name: darwin
            arch: amd64
          - runner: fixed-egress-4c-16g
            os_name: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      ARCH_NAME: ${{ matrix.arch }}
      OS_NAME: ${{ matrix.os_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: 1.26

      - name: Build ${{ matrix.os_name }}-${{ matrix.arch }} binary
        id: build
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_NAME="${{ env.BINARY_NAME }}_${{ github.event.inputs.tag || github.ref_name }}_${OS_NAME}_${ARCH_NAME}"
          OUTPUT_DIR="dist/${OUTPUT_NAME}"
          ARCHIVE_NAME="${OUTPUT_NAME}.tar.gz"
          ARCHIVE_PATH="${OUTPUT_DIR}/${ARCHIVE_NAME}"

          echo "archive_path=${ARCHIVE_PATH}" >> "$GITHUB_OUTPUT"
          mkdir -p "${OUTPUT_DIR}"

          CGO_ENABLED=0 GOOS="$OS_NAME" GOARCH="$ARCH_NAME" \
            go build -ldflags="-s -w" -o "${OUTPUT_DIR}/${{ env.BINARY_NAME }}" cmd/watcher/main.go

          tar -czvf "${ARCHIVE_PATH}" -C "${OUTPUT_DIR}" "${{ env.BINARY_NAME }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 1

  release_binaries:
    name: Upload binaries to GitHub Release
    needs: binaries
    runs-on: fixed-egress-4c-16g
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "dist/*.tar.gz"
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          file_glob: true
          overwrite: true

  image-tag:
    runs-on: fixed-egress-4c-16g
    outputs:
      tag: ${{ steps.determine-tag.outputs.tag }}
    steps:
      - name: Determine Image Tag
        id: determine-tag
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
              echo "Setting image tag to ${{ github.event.inputs.tag || github.ref_name }}"
              echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
              TAG="${{ github.event.inputs.tag || github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)"
              echo "Setting image tag to $TAG"
              echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

  build-images:
    needs:
      - image-tag
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    runs-on: fixed-egress-4c-16g
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build image (no push)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: Dockerfile
          labels: |-
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.name=${{ env.IMAGE_NAME }}
            org.opencontainers.image.version=${{ needs.image-tag.outputs.tag }}
            org.opencontainers.image.authors=contact@kiln.fi
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.image-tag.outputs.tag }}-${{ matrix.arch }}
          outputs: type=docker,dest=/tmp/image-${{ matrix.arch }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-${{ matrix.arch }}
          path: /tmp/image-${{ matrix.arch }}.tar
          retention-days: 1

  scan-images:
    name: grype
    needs:
      - image-tag
      - build-images
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    runs-on: fixed-egress-4c-16g
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-image-${{ matrix.arch }}
          path: /tmp

      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          image: /tmp/image-${{ matrix.arch }}.tar
          fail-build: true
          severity-cutoff: critical
          only-fixed: true

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  push-images:
    needs:
      - image-tag
      - scan-images
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    runs-on: fixed-egress-4c-16g
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-image-${{ matrix.arch }}
          path: /tmp

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          docker load --input /tmp/image-${{ matrix.arch }}.tar
          docker push ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.image-tag.outputs.tag }}-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.image-tag.outputs.tag }}-${{ matrix.arch }} \
            | cut -d@ -f2)
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-linux-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: fixed-egress-4c-16g
    needs:
      - image-tag
      - push-images
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Create manifest list and push
        working-directory: /tmp/digests
        shell: bash
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:latest" \
            -t "${REGISTRY_IMAGE}:${{ needs.image-tag.outputs.tag }}" \
            $(printf "${REGISTRY_IMAGE}:${{ needs.image-tag.outputs.tag }}-%s " amd64 arm64)
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}

      - name: Inspect image
        shell: bash
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:latest"
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ needs.image-tag.outputs.tag }}"
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}

  sign:
    runs-on: fixed-egress-4c-16g
    needs:
      - image-tag
      - merge
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.image-tag.outputs.tag }}
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
