name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: tron-validator-watcher

jobs:
  image-tag:
    name: image-tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.determine-tag.outputs.tag }}
    steps:
      - name: Determine Image Tag
        id: determine-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" == "pull_request" ]; then
            TAG="pr-${PR_NUMBER}-${GITHUB_SHA::7}"
          else
            TAG="${REF_NAME}-${GITHUB_SHA::7}"
          fi
          echo "Setting image tag to $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build:
    name: build
    needs:
      - image-tag
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON('["amd64", "arm64"]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image (no push)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.image-tag.outputs.tag }}-${{ matrix.arch }}
          outputs: type=docker,dest=/tmp/image-${{ matrix.arch }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/image-${{ matrix.arch }}.tar
          retention-days: 1

  scan:
    name: grype
    needs:
      - image-tag
      - build
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON('["amd64", "arm64"]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-${{ matrix.arch }}
          path: /tmp

      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: /tmp/image-${{ matrix.arch }}.tar
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  push:
    name: push
    if: github.event_name == 'push'
    needs:
      - image-tag
      - scan
    permissions:
      packages: write # push images to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    runs-on: fixed-egress-4c-16g
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE_TAG: ${{ needs.image-tag.outputs.tag }}
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/tron-validator-watcher
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-${{ matrix.arch }}
          path: /tmp

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          docker load --input /tmp/image-${ARCH}.tar
          docker push ${REGISTRY_IMAGE}:${IMAGE_TAG}-${ARCH}

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' \
            ${REGISTRY_IMAGE}:${IMAGE_TAG}-${ARCH} \
            | cut -d@ -f2)
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-linux-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge
    if: github.event_name == 'push'
    runs-on: fixed-egress-4c-16g
    env:
      IMAGE_TAG: ${{ needs.image-tag.outputs.tag }}
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/tron-validator-watcher
    permissions:
      packages: write # push images to ghcr.io
    needs:
      - image-tag
      - push
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Create manifest list and push
        working-directory: /tmp/digests
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:${IMAGE_TAG}" \
            $(printf "${REGISTRY_IMAGE}:${IMAGE_TAG}-%s " amd64 arm64)

      - name: Inspect image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${IMAGE_TAG}"

  sign:
    name: sign
    if: github.event_name == 'push'
    runs-on: fixed-egress-4c-16g
    env:
      IMAGE_TAG: ${{ needs.image-tag.outputs.tag }}
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/tron-validator-watcher
    needs:
      - image-tag
      - merge
    permissions:
      packages: write # push images to ghcr.io
      id-token: write # needed for cosign keyless signing
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes \
            ${REGISTRY_IMAGE}:${IMAGE_TAG}
