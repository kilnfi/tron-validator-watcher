name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run with config ...
        2. Wait for block ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include logs if relevant.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of tron-validator-watcher are you running?
      placeholder: "e.g. v0.3.1"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration (redacted)
      description: Paste your config file with sensitive values removed.
      render: yaml
